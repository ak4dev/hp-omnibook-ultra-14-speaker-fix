# omnibook-speaker-fix: keep udev from auto-loading the TAS2783 amplifier driver at boot;
# omnibook-tas2783-late.service loads it once the DSP has booted.  An explicit modprobe
# still works.
#
# >>> THE RATIONALE BELOW WAS DISPROVEN.  See docs/defects.md, defect 3. <<<
# The original reasoning was that tas_io_init() downloads the amp firmware from the
# SoundWire attach callback, and that on Intel ACE 2.0+ that lands before
# hda_dsp_post_fw_run() enables SoundWire interrupts.  On Panther Lake it does not:
# hda_sdw_int_enable() dispatches to chip->enable_sdw_irq and ptl_chip_info has no such
# member, and post_fw_run here is lnl_dsp_post_fw_run, a stub.  The SoundWire interrupt
# is enabled at link power-up, 267 ms BEFORE the DSP boots.
#
# It is kept because no evidence shows the deferral either prevents or causes the loss
# (one boot had it and lost all four amps; one lacked it and also lost all four), and
# because removing it is an attended-reboot experiment nobody has run.  Remove with
# `omnibook-speaker-fix undefer` if you want to test it.
blacklist snd_soc_tas2783_sdw
