# omnibook-speaker-fix: light up the SoundWire enumeration window and the DSP boot
# boundary.  Log volume only -- this changes no behaviour.  Remove the file to revert.
#
#   soundwire_bus      "Slave attached, programming device number", "SDW Slave class_id",
#                      "signaling initialization completion", "state check1: UNATTACHED"
#   soundwire_cadence  "Slave status change: 0x...", "Peripheral N status", the rescan
#   soundwire_intel    link power-up ("clock source %d LVSCTL"), one line per link
#   snd_soc_tas2783_sdw the codec's own attach/detach view
#   snd_sof (loader.c) "booting DSP firmware" / "firmware boot complete" -- the two
#                      lines that place the detach inside or after the DSP boot
#
# Caveat worth knowing before treating a traced boot as comparable to an untraced one:
# dev_dbg printk in cdns_update_slave_status_work() runs under
# cdns->status_update_lock, so the SoundWire dyndbg is NOT a free variable.
options soundwire_bus dyndbg=+p
options soundwire_cadence dyndbg=+p
options soundwire_intel dyndbg=+p
options snd_soc_tas2783_sdw dyndbg=+p
options snd_sof dyndbg="file loader.c +p"

# The two markers that place the detach inside the code-loader DMA or inside the
# FW_READY wait -- "Attempting iteration %d of Core En/ROM load" and "Firmware download
# successful" live in snd_sof_intel_hda_common.  This is what produced the measurement
# in docs/defects.md defect 4.
options snd_sof_intel_hda_common dyndbg=+p
options snd_sof_intel_hda_generic dyndbg=+p
