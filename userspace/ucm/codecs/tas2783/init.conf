# TI TAS2783 SoundWire smart-amp specific control settings.
#
# Included from /sof-soundwire/sof-soundwire.conf when SpeakerCodecFile is
# "tas2783".  Upstream that include is gated by the regex at
# sof-soundwire.conf "If.spk / False.If.filter"; "tas2783" has to be added to
# that alternation or this file is never read.
#
# Control names come from the kernel, verified on 7.1.9 with
# `amixer -c 1 controls`:
#
#   sound/soc/sdw_utils/soc_sdw_utils.c  lr_4spk_widgets / lr_4spk_controls
#       SND_SOC_DAPM_SPK("Left Spk")   + SOC_DAPM_PIN_SWITCH("Left Spk")
#       ... "Right Spk", "Left Spk2", "Right Spk2"
#     A SOC_DAPM_PIN_SWITCH("X") registers a control named "X Switch" --
#     there is NO plain "X" control, and no "Speaker Switch" as rt1318/rt1320
#     have.  csetting "name='Left Spk'" fails and aborts the whole sequence.
#
#   sound/soc/sdw_utils/soc_sdw_ti_amp.c  asoc_sdw_ti_spk_rtd_init()
#       tas2783-1 -> Left Spk    tas2783-2 -> Right Spk
#       tas2783-3 -> Left Spk2   tas2783-4 -> Right Spk2
#     and asoc_sdw_ti_amp_initial_settings() limits "<prefix> Speaker Volume"
#     to TIAMP_SPK_VOLUME_0DB (200) == 0 dB.

#
# Fold one amp into the stereo virtual controls.
#
# Arguments:
#   Amp - amplifier number (1..4), matching the tas2783-N name_prefix
#   Pin - DAPM pin name for that amp ("Left Spk", "Right Spk", ...)
#   Ch  - virtual channel: 0 = front left, 1 = front right
#
# Gated on ControlExists rather than on ${var:SpeakerAmps} so that a 2-amp
# machine silently maps only the two amps it has, and so that a failed amp
# probe degrades instead of aborting the sequence.
#
DefineMacro.tas2783spkmap.If.0 {
	Condition {
		Type ControlExists
		Control "name='tas2783-${var:__Amp} Speaker Volume'"
	}
	True.LibraryConfig.remap.Config.ctl.default.map {
		"name='tas2783 Speaker Playback Volume'" {
			"name='tas2783-${var:__Amp} Speaker Volume'".vindex."${var:__Ch}" 0
		}
		"name='tas2783 Speaker Playback Switch'" {
			"name='${var:__Pin} Switch'".vindex."${var:__Ch}" 0
		}
	}
}

Define.SpeakerMixerElem "tas2783 Speaker"

#
# Every present amplifier is folded into BOTH virtual channels, not into the
# left/right split the name_prefixes imply.  Measured on this machine
# (2026-08-27, session 7, boot 14:04) with the endpoint filter installed and
# amps 2 and 4 surviving: a sweep in the stream's LEFT channel is audible from
# both live amplifiers, and a sweep in the RIGHT channel is silent -- so after
# the filter decrements num_devs the one remaining codec on each link takes
# channel 0, and the prefix names ("Right Spk", "Right Spk2") do not describe
# which stream channel an amp actually receives.  A left/right vindex split
# would therefore leave one virtual channel controlling nothing.
#
# The matching half of this decision is PlaybackChannels 1 in
# /sof-soundwire/tas2783.conf -- with every amp on channel 0, a stereo sink
# would silently discard all right-channel content.
#
# Revisit BOTH if the amplifier situation ever changes (all four alive, or a
# kernel change that assigns the survivors distinct channel masks): re-run the
# per-channel sweep test before assuming stereo.
#
Macro [
	{ tas2783spkmap { Amp 1 Pin "Left Spk"   Ch 0 } }
	{ tas2783spkmap { Amp 1 Pin "Left Spk"   Ch 1 } }
	{ tas2783spkmap { Amp 2 Pin "Right Spk"  Ch 0 } }
	{ tas2783spkmap { Amp 2 Pin "Right Spk"  Ch 1 } }
	{ tas2783spkmap { Amp 3 Pin "Left Spk2"  Ch 0 } }
	{ tas2783spkmap { Amp 3 Pin "Left Spk2"  Ch 1 } }
	{ tas2783spkmap { Amp 4 Pin "Right Spk2" Ch 0 } }
	{ tas2783spkmap { Amp 4 Pin "Right Spk2" Ch 1 } }
]
