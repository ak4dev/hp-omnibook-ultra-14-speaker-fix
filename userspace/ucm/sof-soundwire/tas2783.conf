# Use case Configuration for sof-soundwire card -- TI TAS2783 speakers.
#
# Included from /sof-soundwire/HiFi.conf as
#   /sof-soundwire/${var:SpeakerCodecFile}.conf
# whenever SpeakerCodecFile is non-empty, with no regex filter, so this file
# alone is what creates the Speaker device.
#
# The Speaker PCM is device 2 on this card (confirmed with `aplay -l`:
# "card 1: sofsoundwire, device 2: Speaker (*)"), the same slot rt1318,
# rt1320, cs35l56 and cs42l43-spk all use.

#
# Enable one amp's DAPM pin.
#
# Arguments:
#   Pin - DAPM pin name ("Left Spk", "Right Spk", "Left Spk2", "Right Spk2")
#
# SOC_DAPM_PIN_SWITCH("Left Spk") creates a control called "Left Spk Switch";
# there is no bare "Left Spk" control.  Each pin is guarded by ControlExists
# because a single failing cset aborts the entire sequence, and a 2-amp
# machine has only the first two pins.
#
# >>> THERE IS DELIBERATELY NO DisableSequence.  Session 8, 2026-08-27. <<<
# It used to carry `cset "name='${var:__Pin} Switch' 0"`, and that one line
# silenced the speakers on every boot.  /sof-soundwire/HiFi.conf's own
# EnableSequence opens with `disdevall ""`, and alsa-lib's
# run_device_all_sequence() (ucm/main.c:712-736, dispatched at :912-916) runs
# the DisableSequence of EVERY device in the verb unconditionally -- enabled or
# not -- whenever the verb is set.  ACP sets the verb during card creation
# (pa_alsa_ucm_get_verb, alsa-ucm.c:1129; again from add_pro_profile, acp.c:346),
# which on the 2026-08-27 15:18 boot landed at monotonic ~19.36, about 140 ms
# AFTER omnibook-speaker-mixer.service had finished restoring the pins at 19.219.
# So the pins were set on, then cleared, and the machine came up silent.
#
# In a working profile that would be harmless: disdevall puts the card in a
# known-off state and ACP then enables the device it wants, whose EnableSequence
# turns the pins back on.  Here the HiFi profile is thrown away before anything
# is ever enabled (see the PlaybackChannels note below), so the disable is the
# only half that ever runs.  Dropping it costs nothing while that is true, and
# stays correct if the profile ever starts building: enabling Speaker still
# turns the pins on, and leaving them on when it is disabled is what this
# machine wants anyway -- the speakers are driven by a direct PipeWire node,
# not by this device.
#
DefineMacro.tas2783spk.If.0 {
	Condition {
		Type ControlExists
		Control "name='${var:__Pin} Switch'"
	}
	True {
		EnableSequence [
			cset "name='${var:__Pin} Switch' 1"
		]
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Macro.pin1.tas2783spk { Pin "Left Spk" }
	Macro.pin2.tas2783spk { Pin "Right Spk" }
	Macro.pin3.tas2783spk { Pin "Left Spk2" }
	Macro.pin4.tas2783spk { Pin "Right Spk2" }

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		# >>> DO NOT "FIX" THIS TO 2 WITHOUT READING STATE.md § 6.1. <<<
		#
		# This value is why ACP builds no HiFi profile for the card, and that
		# is currently PROTECTIVE, not a bug to fix.
		#
		# The mechanism, measured session 8: PlaybackChannels 1 sets
		# m->channel_map.channels = 1, which sets exact_channels = true
		# (alsa-ucm.c:2408) and makes pa_alsa_open_by_device_string() call
		# snd_pcm_hw_params_set_channels(pcm, hwparams, 1) with no _near
		# fallback (alsa-util.c:297).  hw:1,2 is fixed at two channels --
		# sof-sdca-2amp-id2.tplg declares channels_min = channels_max = 2 --
		# so the open is rejected inside snd_pcm_hw_refine.  The retry that
		# should rescue it wraps the name as plug:SLAVE='%s' (alsa-util.c:754)
		# WITHOUT stripping alsa-lib's UCM alib prefix, so it asks for
		# plug:SLAVE='_ucm0001.hw:sofsoundwire,2' and dies -ENOENT.  Speaker is
		# first in p->output_mappings, and ucm_probe_profile_set() breaks the
		# whole profile on the first mapping that fails (alsa-ucm.c:2589-2595),
		# so the single HiFi profile is dropped and only off + pro-audio remain.
		#
		# The earlier comment here claimed one channel would make alsa-lib's
		# plug layer downmix L+R and duplicate it.  That was wrong -- the plug
		# layer is never reached.
		#
		# Why leaving it broken is the right call for now: the speakers are
		# already driven by a direct api.alsa.pcm.sink node on omnibook_spk
		# (~/.config/pipewire/pipewire.conf.d/50-omnibook-laptop-speaker.conf),
		# which holds hw:1,2 through ~/.asoundrc's plug+route summing.  If a
		# HiFi profile appeared, WirePlumber would move the card off profile
		# "off" and ACP would open hw:1,2 for the Speaker port as well -- two
		# openers of the one substream, which is exactly the condition that
		# wedged this PCM in session 7 and is recoverable only by a reboot that
		# needs a FIDO2 touch at the console.  Fixing this means first deciding
		# which of the two owns the PCM, and the direct node is the one that
		# does the L+R -> channel 0 summing the surviving amps need.
		PlaybackChannels 1
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "${var:SpeakerMixerElem}"
		PlaybackSwitch "${var:SpeakerMixerElem} Playback Switch"
	}
}
