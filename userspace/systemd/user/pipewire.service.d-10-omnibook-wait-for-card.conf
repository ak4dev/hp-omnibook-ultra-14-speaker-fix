# omnibook-speaker-fix: wait for the sof-soundwire card before PipeWire builds its graph.
#
# Install as ~/.config/systemd/user/pipewire.service.d/10-omnibook-wait-for-card.conf
#
# On the 2026-08-27 14:04 boot pipewire.service started at monotonic 20.88 and the
# card registered at 22.65 -- 1.8 s later.  The "Laptop Speakers" node is an
# api.alsa.pcm.sink bound to omnibook_spk, and PipeWire creates context.objects once
# at startup: if the PCM does not exist yet the node is simply absent, and the
# speakers are missing until something restarts PipeWire.  Proven on the 2026-08-27
# 15:18 boot -- the race happened and this drop-in absorbed it, blocking 3.01 s.
#
# Waiting on the playback PCM node itself, not just the card directory, because the
# card appears before its PCMs do.
#
# Addressed by card ID (/proc/asound/sofsoundwire is a symlink to the current
# card<N>), not by index: the index moves depending on what else is present at boot.
#
# Bounded at 45 s and always exits 0, so a machine with no internal speakers at all
# still starts PipeWire normally.
#
# ORDERING HAZARD, and it is real: this drop-in inverts the ordering that used to
# protect the DAPM pin switches.  See docs/traps.md "the silent boot".
[Service]
ExecStartPre=/usr/bin/bash -c 'for _ in $(seq 45); do [ -e /proc/asound/sofsoundwire/pcm2p ] && exit 0; sleep 1; done; exit 0'
