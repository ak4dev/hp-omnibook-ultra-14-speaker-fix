# omnibook-speaker-fix: the internal TAS2783 speakers, added as a PipeWire node directly.
#
# Install as ~/.config/pipewire/pipewire.conf.d/50-omnibook-laptop-speaker.conf
#
# WHY NOT UCM/ACP
# PipeWire's ACP layer builds no HiFi profile for this card at all (`pactl list
# cards` offers only "off" and "pro-audio"), even with a valid UCM tree that
# `alsaucm -c <card> list _devices/HiFi` reports a Speaker device in.  That failure
# is currently PROTECTIVE rather than a bug -- see docs/ucm.md.  ACP holds the card
# at profile "off", so nothing else is using these PCMs and the two cannot fight.
#
# WHY THE omnibook_spk DEVICE AND NOT THE RAW PCM
# After the endpoint filter drops the two amplifiers that leave the bus during the
# DSP firmware boot, the single surviving codec on each link takes stream channel 0.
# Measured 2026-08-27: a sweep in the LEFT channel is audible from both live amps, a
# sweep in the RIGHT channel is silent -- so a plain stereo open discards every
# right-channel sample.  omnibook_spk (defined in ~/.asoundrc) sums both channels
# into hardware channel 0 at -6 dB each.
#
# Declaring the node MONO instead does NOT work: with audio.channels = 1 and
# audio.position = [ MONO ] the adapter still exposes playback_FL/playback_FR,
# `pactl` still reports s32le 2ch, and PipeWire routes FL only, so right-channel
# content is dropped exactly as with a raw stereo open.  Verified live.  Do the
# summing in ALSA, not in PipeWire.
#
# Re-run the per-channel sweep test before changing this.
context.objects = [
    {   factory = adapter
        # nofail is LOAD-BEARING.  Without it, a context.objects entry that cannot be
        # created aborts PipeWire's whole context and the daemon exits -- observed
        # 2026-08-27: with the Speaker PCM held by a leaked substream, pipewire.service
        # died with "failed to create context: Device or resource busy" and the machine
        # had NO audio at all until this file was removed.
        # /usr/share/pipewire/pipewire.conf documents the flag: "If nofail is given,
        # errors are ignored (and no object is created)."  With it, an unavailable
        # speaker PCM costs the speaker sink and nothing else.
        flags = [ nofail ]
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "alsa_output.omnibook-laptop-speaker"
            node.description = "Laptop Speakers"
            media.class      = "Audio/Sink"
            api.alsa.path    = "omnibook_spk"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            audio.rate       = 48000
        }
    }
]
